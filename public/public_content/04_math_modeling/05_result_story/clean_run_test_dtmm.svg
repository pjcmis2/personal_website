<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#202743"/></linearGradient>
    <style>text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#eef4ff}.title{font-size:42px;font-weight:800}.sub{font-size:22px;fill:#a7b8d4}.card{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.18)}.big{font-size:34px;font-weight:800}.label{font-size:21px;font-weight:700}.small{font-size:18px;fill:#b8c6dc}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="64" y="76" class="title">Momentum 随机性检验与 DTMM 预测</text>
  <text x="64" y="116" class="sub">Run Test 证明 momentum 非随机；DTMM 将 momentum 与客观特征一起用于得分走势预测</text>
  <rect x="70" y="158" width="500" height="220" rx="24" class="card"/>
  <text x="104" y="214" class="big">Run Test</text>
  <text x="104" y="262" class="label">29 场比赛 momentum p-value = 0</text>
  <text x="104" y="302" class="small">原假设：过程随机。p &lt; 0.05 时拒绝随机性。</text>
  <text x="104" y="342" class="small">结论：momentum 变化具有结构性；单纯胜负波动更接近随机。</text>
  <rect x="630" y="158" width="500" height="220" rx="24" class="card"/>
  <text x="664" y="214" class="big">DTMM</text>
  <text x="664" y="262" class="label">Decision Tree Momentum Model</text>
  <text x="664" y="302" class="small">节点特征：momentum diff、run distance、serve width、speed mph</text>
  <text x="664" y="342" class="small">使用后剪枝控制过拟合，展示 4 层决策树结构。</text>
  <g transform="translate(112 462)">
    <rect x="0" y="0" width="240" height="68" rx="18" fill="#ffd166"/><text x="28" y="43" class="label" fill="#061324">clean data</text>
    <path d="M250 34 L340 34" stroke="#7dd3fc" stroke-width="5"/><path d="M340 34 l-14 -10 v20z" fill="#7dd3fc"/>
    <rect x="356" y="0" width="240" height="68" rx="18" fill="#60a5fa"/><text x="386" y="43" class="label">Momentum</text>
    <path d="M606 34 L696 34" stroke="#7dd3fc" stroke-width="5"/><path d="M696 34 l-14 -10 v20z" fill="#7dd3fc"/>
    <rect x="712" y="0" width="300" height="68" rx="18" fill="#a78bfa"/><text x="742" y="43" class="label">score prediction</text>
  </g>
  <text x="80" y="646" class="sub">关键读法：先证明 momentum 值有信息量，再把它作为决策树核心输入进入比分预测。</text>
</svg>
