<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 14px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrowDb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc"/>

  <text x="60" y="60" class="title">调度层 + 执行层：数据库视角</text>
  <text x="60" y="92" class="subtitle">原则：中心数据库保存全局真相；节点本地只做执行和临时缓存，不各自维护一套业务真相表。</text>

  <rect x="50" y="130" width="720" height="780" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="168" class="section">A. 调度层对象（新增）</text>

  <rect x="90" y="200" width="280" height="150" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="115" y="228" class="label">大任务对象</text>
  <text x="115" y="255" class="text">表示：一次 10000 handle 的总任务</text>
  <text x="115" y="280" class="small">职责：</text>
  <text x="145" y="305" class="small">- 记录总任务状态</text>
  <text x="145" y="325" class="small">- 记录总 handle 集合</text>
  <text x="145" y="345" class="small">- 记录总进度 / 是否结束</text>

  <rect x="410" y="200" width="300" height="180" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="435" y="228" class="label">小批对象</text>
  <text x="435" y="255" class="text">表示：从大任务切出的一个批次，例如 50 个 handle</text>
  <text x="435" y="280" class="small">职责：</text>
  <text x="465" y="305" class="small">- 记录这一批有哪些 handle</text>
  <text x="465" y="325" class="small">- 记录需要哪些 provider</text>
  <text x="465" y="345" class="small">- 记录分配给哪台节点</text>
  <text x="465" y="365" class="small">- 记录最终对应哪个现有 job</text>

  <rect x="90" y="420" width="280" height="190" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="115" y="448" class="label">资源对象</text>
  <text x="115" y="475" class="text">表示：EasyKOL / Apify / DeepSeek 账号池</text>
  <text x="115" y="500" class="small">职责：</text>
  <text x="145" y="525" class="small">- 记录唯一资源标识</text>
  <text x="145" y="545" class="small">- 记录 idle / leased / cooling</text>
  <text x="145" y="565" class="small">- 记录租给了哪个小批</text>
  <text x="145" y="585" class="small">- 记录租约过期时间</text>

  <rect x="410" y="420" width="300" height="170" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="435" y="448" class="label">节点对象</text>
  <text x="435" y="475" class="text">表示：执行节点 / 服务器池</text>
  <text x="435" y="500" class="small">职责：</text>
  <text x="465" y="525" class="small">- 记录节点能力与在线状态</text>
  <text x="465" y="545" class="small">- 记录当前 busy / idle</text>
  <text x="465" y="565" class="small">- 记录当前处理哪个小批</text>

  <rect x="90" y="660" width="620" height="210" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="115" y="690" class="label">调度层关系</text>
  <text x="115" y="720" class="small">1. 一个大任务包含很多小批。</text>
  <text x="115" y="745" class="small">2. 一个小批开始前，必须租到 1 个节点 + 所需 provider 资源。</text>
  <text x="115" y="770" class="small">3. 一个资源在某一时刻只能属于一个小批，靠租约控制。</text>
  <text x="115" y="795" class="small">4. 当前简化模型下，一个节点一次只处理一个小批。</text>
  <text x="115" y="820" class="small">5. 小批完成后释放资源，更新大任务进度，再调度下一批。</text>

  <rect x="830" y="130" width="720" height="780" rx="22" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="860" y="168" class="section">B. 执行层对象（尽量沿用现有）</text>

  <rect x="870" y="200" width="280" height="170" rx="16" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="895" y="228" class="label">jobs / job_handles</text>
  <text x="895" y="255" class="text">表示：一个已投递的小批任务，在现有系统里的执行实体</text>
  <text x="895" y="280" class="small">职责：</text>
  <text x="925" y="305" class="small">- 继续沿用现在的状态机</text>
  <text x="925" y="325" class="small">- 继续沿用 provider 编排</text>
  <text x="925" y="345" class="small">- 跟踪这一个小批内部的 handle</text>

  <rect x="1190" y="200" width="300" height="170" rx="16" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1215" y="228" class="label">provider_runs</text>
  <text x="1215" y="255" class="text">表示：EasyKOL / Apify / DeepSeek / Merge 的执行记录</text>
  <text x="1215" y="280" class="small">职责：</text>
  <text x="1245" y="305" class="small">- 记录输入输出摘要</text>
  <text x="1245" y="325" class="small">- 记录错误信息</text>
  <text x="1245" y="345" class="small">- 继续支持扫描器和重试机制</text>

  <rect x="870" y="420" width="280" height="160" rx="16" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="895" y="448" class="label">final_results</text>
  <text x="895" y="475" class="text">表示：小批最终汇总后的标准结果</text>
  <text x="895" y="500" class="small">职责：</text>
  <text x="925" y="525" class="small">- 保留统一 JSON 结果</text>
  <text x="925" y="545" class="small">- 供后续 final_feishu / query 使用</text>

  <rect x="1190" y="420" width="300" height="160" rx="16" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1215" y="448" class="label">final_feishu</text>
  <text x="1215" y="475" class="text">表示：查询与导出的飞书投影表</text>
  <text x="1215" y="500" class="small">职责：</text>
  <text x="1245" y="525" class="small">- 给 query 页面直接读</text>
  <text x="1245" y="545" class="small">- 给 xlsx 导出直接读</text>

  <rect x="870" y="660" width="620" height="210" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="895" y="690" class="label">执行层关系</text>
  <text x="895" y="720" class="small">1. 调度层只负责把“小批”转成现有系统里的一次普通 job。</text>
  <text x="895" y="745" class="small">2. EasyKOL / Apify / DeepSeek / Merge 继续按现有状态机运行。</text>
  <text x="895" y="770" class="small">3. 小批结果统一落到中心 final_results。</text>
  <text x="895" y="795" class="small">4. query / 导出只面向中心 final_feishu，不从各节点本地拼结果。</text>

  <path d="M370 275 H402" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>
  <path d="M550 380 V408" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>
  <path d="M370 515 H402" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>
  <path d="M710 505 H850" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>
  <path d="M1150 285 H1182" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>
  <path d="M1010 370 V408" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>
  <path d="M1150 500 H1182" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowDb)"/>

  <rect x="610" y="120" width="150" height="60" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="632" y="145" class="label">中心数据库</text>
  <text x="632" y="168" class="small">调度层 + 执行层共用</text>

  <path d="M760 150 H822" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowDb)"/>

  <rect x="1220" y="120" width="300" height="60" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1245" y="145" class="label">关键原则</text>
  <text x="1245" y="168" class="small">不要每台服务器一套完整业务表；业务状态和结果真相必须中心化。</text>
</svg>
