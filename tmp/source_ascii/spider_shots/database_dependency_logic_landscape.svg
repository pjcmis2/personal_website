<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">spider2table database dependency logic</title>
  <desc id="desc">A landscape vector diagram showing the main database dependency flow from users and jobs to provider data, merge worker, final results, status refresh, and cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b3fb2"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .box { stroke-width: 2.5; rx: 12; ry: 12; }
      .core { fill: #e8f3ff; stroke: #2e6fbe; }
      .worker { fill: #fff4d6; stroke: #c48300; }
      .data { fill: #eaf7ea; stroke: #2e8b57; }
      .final { fill: #f4eaff; stroke: #7b3fb2; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .small { font: 400 15px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-final { fill: none; stroke: #7b3fb2; stroke-width: 2.8; marker-end: url(#arrow-purple); }
      .edge-dash { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .note { font: 400 14px Arial, sans-serif; fill: #4b5563; text-anchor: middle; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #374151; }
      .lane { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; rx: 18; ry: 18; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="80" y="70">spider2table 数据库主逻辑依赖图</text>
  <text class="subtitle" x="80" y="102">横板简化版：保留主链路、provider 分支、标准化数据、合并输出和缓存/状态关系</text>

  <rect class="lane" x="60" y="145" width="310" height="650"/>
  <text class="lane-title" x="85" y="180">1. 作业主干</text>
  <rect class="lane" x="410" y="145" width="330" height="650"/>
  <text class="lane-title" x="435" y="180">2. Provider 分支</text>
  <rect class="lane" x="780" y="145" width="360" height="650"/>
  <text class="lane-title" x="805" y="180">3. 原始层与标准化层</text>
  <rect class="lane" x="1180" y="145" width="360" height="650"/>
  <text class="lane-title" x="1205" y="180">4. 合并输出</text>

  <rect class="box core" x="105" y="235" width="220" height="86"/>
  <text class="label" x="215" y="270">users</text>
  <text class="small" x="215" y="295">用户 / 权限隔离</text>

  <rect class="box core" x="105" y="390" width="220" height="86"/>
  <text class="label" x="215" y="425">jobs</text>
  <text class="small" x="215" y="450">一次查询任务</text>

  <rect class="box core" x="105" y="545" width="220" height="96"/>
  <text class="label" x="215" y="580">job_handles</text>
  <text class="small" x="215" y="605">每个账号一行</text>
  <text class="small" x="215" y="625">保存 worker 状态</text>

  <rect class="box worker" x="465" y="220" width="220" height="82"/>
  <text class="label" x="575" y="254">EasyKOL</text>
  <text class="small" x="575" y="278">账号画像</text>

  <rect class="box worker" x="465" y="390" width="220" height="82"/>
  <text class="label" x="575" y="424">Apify</text>
  <text class="small" x="575" y="448">近期视频</text>

  <rect class="box worker" x="465" y="560" width="220" height="82"/>
  <text class="label" x="575" y="594">DeepSeek</text>
  <text class="small" x="575" y="618">内容分类</text>

  <rect class="box data" x="820" y="205" width="260" height="82"/>
  <text class="label" x="950" y="239">source_files</text>
  <text class="small" x="950" y="263">EasyKOL Excel 文件</text>

  <rect class="box data" x="820" y="330" width="260" height="88"/>
  <text class="label" x="950" y="364">provider_raw_rows</text>
  <text class="small" x="950" y="389">外部原始数据备份</text>

  <rect class="box data" x="820" y="470" width="260" height="82"/>
  <text class="label" x="950" y="504">creator_profiles</text>
  <text class="small" x="950" y="528">标准化账号画像</text>

  <rect class="box data" x="820" y="600" width="260" height="82"/>
  <text class="label" x="950" y="634">creator_videos</text>
  <text class="small" x="950" y="658">标准化视频数据</text>

  <rect class="box data" x="820" y="720" width="260" height="82"/>
  <text class="label" x="950" y="754">content_labels</text>
  <text class="small" x="950" y="778">分类 / 摘要</text>

  <rect class="box final" x="1240" y="330" width="240" height="96"/>
  <text class="label" x="1360" y="365">merge_worker</text>
  <text class="small" x="1360" y="390">按账号合并</text>
  <text class="small" x="1360" y="410">profile + videos + labels</text>

  <rect class="box final" x="1240" y="505" width="240" height="102"/>
  <text class="label" x="1360" y="540">final_results</text>
  <text class="small" x="1360" y="565">最终结果</text>
  <text class="small" x="1360" y="586">job + handle 唯一</text>

  <rect class="box data" x="1240" y="665" width="240" height="82"/>
  <text class="label" x="1360" y="699">provider_cache</text>
  <text class="small" x="1360" y="723">下次查询可复用</text>

  <rect class="box worker" x="1240" y="205" width="240" height="82"/>
  <text class="label" x="1360" y="239">provider_runs</text>
  <text class="small" x="1360" y="263">外部执行记录</text>

  <path class="edge" d="M215 321 L215 390"/>
  <path class="edge" d="M215 476 L215 545"/>
  <path class="edge" d="M325 585 C380 500, 405 270, 465 261"/>
  <path class="edge" d="M325 593 C380 570, 405 443, 465 431"/>
  <path class="edge" d="M325 602 C390 632, 410 612, 465 601"/>

  <path class="edge" d="M685 261 L820 246"/>
  <path class="edge" d="M685 261 C725 285, 760 335, 820 358"/>
  <path class="edge" d="M685 431 L820 374"/>
  <path class="edge" d="M685 431 C740 445, 760 488, 820 511"/>
  <path class="edge" d="M685 431 C745 515, 760 615, 820 641"/>
  <path class="edge" d="M685 601 C745 640, 760 725, 820 761"/>
  <path class="edge" d="M950 287 L950 330"/>
  <path class="edge" d="M950 418 L950 470"/>
  <path class="edge-dash" d="M950 682 L950 720"/>
  <text class="note" x="1015" y="707">DeepSeek 输入</text>

  <path class="edge" d="M1080 511 C1160 500, 1195 390, 1240 378"/>
  <path class="edge" d="M1080 641 C1160 635, 1195 420, 1240 395"/>
  <path class="edge" d="M1080 761 C1170 735, 1195 430, 1240 410"/>
  <path class="edge" d="M325 613 C780 865, 1120 475, 1240 402"/>
  <path class="edge-final" d="M1360 426 L1360 505"/>

  <path class="edge-dash" d="M685 261 C885 120, 1120 180, 1240 236"/>
  <path class="edge-dash" d="M685 431 C900 250, 1110 235, 1240 246"/>
  <path class="edge-dash" d="M685 601 C900 540, 1110 275, 1240 263"/>

  <path class="edge-dash" d="M1360 607 L1360 665"/>
  <path class="edge-dash" d="M1240 706 C1140 705, 1130 574, 1240 556"/>
  <text class="note" x="1190" y="638">cache hit 复制历史结果</text>

  <path class="edge-dash" d="M1240 360 C1120 210, 480 120, 255 390"/>
  <text class="note" x="780" y="154">refresh_job_progress 根据 job_handles 聚合回写 jobs.status</text>
</svg>
