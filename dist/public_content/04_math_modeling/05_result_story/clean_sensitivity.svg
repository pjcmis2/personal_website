<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#081322"/>
  <style>text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#eef4ff}.title{font-size:42px;font-weight:800}.sub{font-size:22px;fill:#a8bad6}.label{font-size:22px;font-weight:800}.small{font-size:18px;fill:#b8c6dc}.axis{stroke:#45617f;stroke-width:2}</style>
  <text x="64" y="78" class="title">敏感性分析</text>
  <text x="64" y="118" class="sub">控制变量检查参数组合与决策树深度对预测准确率的影响</text>
  <g transform="translate(90 210)">
    <text x="0" y="-36" class="label">移除单一因素后的准确率</text>
    <line x1="0" y1="300" x2="460" y2="300" class="axis"/><line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <rect x="40" y="143" width="52" height="157" fill="#ef4444"/><text x="34" y="334" class="small">momentum</text><text x="34" y="132" class="small">45.7</text>
    <rect x="140" y="66" width="52" height="234" fill="#ffd166"/><text x="124" y="334" class="small">serve</text><text x="130" y="55" class="small">68.0</text>
    <rect x="240" y="74" width="52" height="226" fill="#ffd166"/><text x="224" y="334" class="small">speed</text><text x="230" y="63" class="small">65.5</text>
    <rect x="340" y="50" width="52" height="250" fill="#ffd166"/><text x="318" y="334" class="small">distance</text><text x="330" y="39" class="small">72.3</text>
    <line x1="0" y1="19" x2="440" y2="19" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="10 8"/><text x="300" y="10" class="small">full model 86.4</text>
  </g>
  <g transform="translate(660 210)">
    <text x="0" y="-36" class="label">树深度与预测准确率</text>
    <line x1="0" y1="300" x2="420" y2="300" class="axis"/><line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <polyline points="30,190 120,162 210,65 300,91 390,158" fill="none" stroke="#7dd3fc" stroke-width="6"/>
    <circle cx="210" cy="65" r="10" fill="#ffd166"/><text x="182" y="45" class="small">depth 10, 90.3%</text>
    <text x="22" y="334" class="small">8</text><text x="112" y="334" class="small">9</text><text x="200" y="334" class="small">10</text><text x="292" y="334" class="small">11</text><text x="382" y="334" class="small">12</text>
  </g>
  <text x="86" y="652" class="sub">结论：momentum 对预测准确率影响最大；树深度 10 在该实验中取得最高预测准确率。</text>
</svg>
