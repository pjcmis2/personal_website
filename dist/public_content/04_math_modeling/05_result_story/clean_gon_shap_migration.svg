<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#091423"/>
  <style>text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#eef4ff}.title{font-size:42px;font-weight:800}.sub{font-size:22px;fill:#a8bad6}.label{font-size:22px;font-weight:800}.small{font-size:18px;fill:#b8c6dc}.card{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.18)}</style>
  <text x="64" y="78" class="title">Match Swing：GON、SHAP 与迁移验证</text>
  <text x="64" y="118" class="sub">从逐点预测扩展到 20-point 波动窗口，分析比赛走势和关键影响因素</text>
  <rect x="70" y="160" width="330" height="420" rx="24" class="card"/>
  <text x="108" y="218" class="label">GON 定义</text>
  <text x="108" y="274" class="small">20 points 内赢球数 S</text>
  <text x="108" y="326" style="font-size:32px;font-weight:900">S &gt; 10 → 1</text>
  <text x="108" y="374" style="font-size:32px;font-weight:900">S = 10 → 0</text>
  <text x="108" y="422" style="font-size:32px;font-weight:900">S &lt; 10 → -1</text>
  <text x="108" y="500" class="small">用于判断窗口内比赛走势对球员是否有利。</text>
  <rect x="438" y="160" width="330" height="420" rx="24" class="card"/>
  <text x="476" y="218" class="label">SHAP 因素贡献</text>
  <rect x="476" y="260" width="220" height="28" fill="#ffd166"/><text x="706" y="282" class="small">momentum 51%</text>
  <rect x="476" y="312" width="82" height="28" fill="#7dd3fc"/><text x="570" y="334" class="small">speed_mph 19%</text>
  <rect x="476" y="364" width="78" height="28" fill="#7dd3fc"/><text x="570" y="386" class="small">serve_width 18%</text>
  <rect x="476" y="416" width="44" height="28" fill="#7dd3fc"/><text x="570" y="438" class="small">p2_distance 10%</text>
  <text x="476" y="512" class="small">Momentum 是 match swings 的主导变量。</text>
  <rect x="806" y="160" width="330" height="420" rx="24" class="card"/>
  <text x="844" y="218" class="label">US Open 迁移</text>
  <text x="844" y="284" style="font-size:46px;font-weight:900">0.6760</text>
  <text x="844" y="330" class="small">预测序列与真实序列 Pearson correlation</text>
  <text x="844" y="406" class="label">泛化边界</text>
  <text x="844" y="452" class="small">赛事、场地、天气差异会扩大波动范围。</text>
  <text x="844" y="500" class="small">模型可迁移，但需要补充环境变量。</text>
</svg>
