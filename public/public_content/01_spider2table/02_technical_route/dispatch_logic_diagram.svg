<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 14px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .mono { font: 600 13px 'Consolas', monospace; fill: #1e293b; }
    </style>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc"/>

  <text x="60" y="60" class="title">分发器 + 资源池 + 现有执行流逻辑图</text>
  <text x="60" y="92" class="subtitle">原则：大任务串行；大任务内部拆成小批次；小批次只有在节点和所需资源齐全时才进入现有执行流。</text>

  <rect x="50" y="130" width="1500" height="120" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="165" class="section">1. 大任务层</text>
  <rect x="80" y="185" width="340" height="42" rx="12" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="100" y="212" class="label">大任务 A</text>
  <text x="190" y="212" class="small">10000 个 handle，按 50 一批拆分</text>
  <rect x="460" y="185" width="340" height="42" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="212" class="label">大任务 B</text>
  <text x="570" y="212" class="small">必须等待大任务 A 全部结束</text>
  <path d="M420 206 H448" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="840" y="212" class="mono">规则：同一时刻只允许 1 个大任务处于运行态</text>

  <rect x="50" y="280" width="1500" height="170" rx="20" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/>
  <text x="80" y="315" class="section">2. 大任务拆成小批次</text>

  <rect x="80" y="340" width="190" height="72" rx="14" fill="#ffffff" stroke="#a3e635" stroke-width="1.5"/>
  <text x="100" y="367" class="label">批次 1</text>
  <text x="100" y="392" class="text">handles 1 - 50</text>
  <text x="100" y="412" class="small">根据选项决定需要哪些 provider</text>

  <rect x="300" y="340" width="190" height="72" rx="14" fill="#ffffff" stroke="#a3e635" stroke-width="1.5"/>
  <text x="320" y="367" class="label">批次 2</text>
  <text x="320" y="392" class="text">handles 51 - 100</text>
  <text x="320" y="412" class="small">等待调度器分配资源</text>

  <rect x="520" y="340" width="190" height="72" rx="14" fill="#ffffff" stroke="#a3e635" stroke-width="1.5"/>
  <text x="540" y="367" class="label">批次 3</text>
  <text x="540" y="392" class="text">handles 101 - 150</text>
  <text x="540" y="412" class="small">等待调度</text>

  <rect x="740" y="340" width="190" height="72" rx="14" fill="#ffffff" stroke="#a3e635" stroke-width="1.5"/>
  <text x="760" y="367" class="label">批次 4</text>
  <text x="760" y="392" class="text">handles 151 - 200</text>
  <text x="760" y="412" class="small">等待调度</text>

  <rect x="980" y="340" width="520" height="72" rx="14" fill="#f7fee7" stroke="#bef264" stroke-width="1.5"/>
  <text x="1005" y="368" class="label">调度器维护一个“待执行小批队列”</text>
  <text x="1005" y="394" class="text">只有“节点可用 + 所需资源齐全”的小批次，才允许进入执行层。</text>

  <rect x="50" y="480" width="790" height="430" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="80" y="515" class="section">3. 分发器 / 调度层</text>

  <rect x="90" y="540" width="710" height="70" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="115" y="567" class="label">步骤 A：挑选下一个待执行小批</text>
  <text x="115" y="592" class="text">先判断这个小批需要哪些 provider，例如 easykol + apify + deepseek，也可能只需要其中一部分。</text>

  <rect x="90" y="630" width="710" height="90" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="115" y="657" class="label">步骤 B：原子租约资源</text>
  <text x="115" y="682" class="text">一次性完成：挑 1 个空闲节点 + 挑齐所需 provider 资源 + 写入租约过期时间。</text>
  <text x="115" y="706" class="small">全有或全无。缺任意 1 个资源，本轮一个都不占用，继续等待。</text>

  <rect x="90" y="740" width="710" height="70" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="115" y="767" class="label">步骤 C：投递到目标节点</text>
  <text x="115" y="792" class="text">记录“分配给哪台节点、租用了哪些资源”，然后把这一批正式投给该节点。</text>

  <rect x="90" y="830" width="710" height="50" rx="14" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="115" y="860" class="label">如果节点满了，或资源池不足：保持等待；等租约释放、超时回收或节点恢复后再重试。</text>

  <rect x="870" y="480" width="680" height="220" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="900" y="515" class="section">4. 资源池 + 节点池</text>

  <rect x="900" y="540" width="190" height="120" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="925" y="567" class="label">EasyKOL 资源池</text>
  <text x="925" y="592" class="text">6 个账号 / token</text>
  <text x="925" y="616" class="small">每个资源都有唯一标识</text>
  <text x="925" y="636" class="small">状态：idle / leased / cooling</text>

  <rect x="1115" y="540" width="190" height="120" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1140" y="567" class="label">Apify 资源池</text>
  <text x="1140" y="592" class="text">6 个账号 / token</text>
  <text x="1140" y="616" class="small">每个资源都有唯一标识</text>
  <text x="1140" y="636" class="small">状态：idle / leased / cooling</text>

  <rect x="1330" y="540" width="190" height="120" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1355" y="567" class="label">DeepSeek 资源池</text>
  <text x="1355" y="592" class="text">6 个账号 / key</text>
  <text x="1355" y="616" class="small">每个资源都有唯一标识</text>
  <text x="1355" y="636" class="small">状态：idle / leased / cooling</text>

  <rect x="900" y="675" width="620" height="50" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="925" y="706" class="label">节点池：6 台服务器，每台上报能力、心跳和 busy / idle 状态</text>

  <rect x="870" y="730" width="680" height="180" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="900" y="765" class="section">5. 现有执行内核（尽量不动）</text>

  <rect x="905" y="790" width="145" height="70" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="928" y="818" class="label">EasyKOL Worker</text>
  <text x="940" y="842" class="small">单线程</text>

  <rect x="1070" y="790" width="145" height="70" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1100" y="818" class="label">Apify Worker</text>
  <text x="1105" y="842" class="small">单线程</text>

  <rect x="1235" y="790" width="145" height="70" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1260" y="818" class="label">DeepSeek Worker</text>
  <text x="1270" y="842" class="small">单线程</text>

  <rect x="1400" y="790" width="120" height="70" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1428" y="818" class="label">Merge</text>
  <text x="1435" y="842" class="small">单线程</text>

  <rect x="905" y="875" width="615" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="925" y="889" class="small">这里继续沿用当前状态机、编排、provider_runs、final_results、final_feishu。</text>

  <path d="M250 412 V505 H96" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowGray)"/>
  <path d="M395 412 V505" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowGray)"/>
  <path d="M615 412 V505" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowGray)"/>
  <path d="M835 412 V505 H794" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowGray)"/>

  <path d="M800 675 H884" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <path d="M1210 725 V780" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <path d="M1510 825 C1530 825, 1530 635, 1510 635" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="1388" y="708" class="small">小批执行完成</text>

  <path d="M1440 910 C1440 940, 160 940, 160 250" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowGray)"/>
  <text x="350" y="958" class="small">每个小批执行完成后：结果写中心数据库，释放租用资源，分发器继续调度下一批。</text>

  <rect x="1120" y="132" width="390" height="105" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1145" y="162" class="section">运行规则</text>
  <text x="1145" y="188" class="text">1. 大任务串行：大任务 B 必须等待大任务 A 完全结束。</text>
  <text x="1145" y="208" class="text">2. 小批并行：只在当前激活的大任务内部并行分发。</text>
  <text x="1145" y="228" class="text">3. 资源分配必须带租约，并且原子完成。</text>
</svg>
